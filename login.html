<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Otello</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/login.js"></script>
</head>
<body>
    <main class="contenedor">
        <h1>Login to Otello</h1>

        <form id="formularioLogin">
            <div class="campo">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
                <p id="mensajeUsuario" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                <p id="mensajeContrasena" aria-live="polite"></p>
            </div>

            <p id="mensajeGeneral" aria-live="polite"></p>

            <button type="submit" id="botonLogin">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
